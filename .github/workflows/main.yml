name: RDP FIXED NO ERRORS

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      shell: powershell
      run: |
        Set-ItemProperty `
          -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
          -Name "fDenyTSConnections" `
          -Value 0 `
          -Force

        netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
        Restart-Service TermService -Force

    - name: Create User
      shell: powershell
      run: |
        net user rdpuser P@ssw0rd123! /add
        net localgroup administrators rdpuser /add
        net localgroup "Remote Desktop Users" rdpuser /add

    - name: Install Tailscale (NO Invoke-WebRequest)
      shell: powershell
      run: |
        winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements

    - name: Start Tailscale
      shell: powershell
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --accept-dns=false
        & "C:\Program Files\Tailscale\tailscale.exe" ip -4

    - name: Keep Alive
      shell: powershell
      run: |
        while ($true) {
          Start-Sleep 300
        }
