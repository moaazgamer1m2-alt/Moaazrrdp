name: Secure RDP with Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    # ===============================
    # Enable RDP + Fix All RDP Errors
    # ===============================
    - name: Configure Core RDP Settings
      shell: powershell
      run: |
        Write-Host "Enabling Remote Desktop..."

        Set-ItemProperty `
          -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
          -Name "fDenyTSConnections" `
          -Value 0 `
          -Force

        Write-Host "Disabling NLA..."

        Set-ItemProperty `
          -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
          -Name "UserAuthentication" `
          -Value 0 `
          -Force

        Set-ItemProperty `
          -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
          -Name "SecurityLayer" `
          -Value 0 `
          -Force

        Write-Host "Opening firewall port 3389..."

        netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
        netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

        Restart-Service TermService -Force

    # ===============================
    # Create RDP User
    # ===============================
    - name: Create RDP User
      shell: powershell
      run: |
        $username = "rdpuser"
        $password = "P@ssw0rd123!"

        net user $username $password /add
        net localgroup administrators $username /add
        net localgroup "Remote Desktop Users" $username /add

        Write-Host "RDP User Created:"
        Write-Host "Username: $username"
        Write-Host "Password: $password"

    # ===============================
    # Install Tailscale
    # ===============================
    - name: Install Tailscale
      shell: powershell
      run: |
        Invoke-WebRequest `
          -Uri "https://pkgs.tailscale.com/stable/tailscale-setup.exe" `
          -OutFile "tailscale.exe"

        Start-Process "tailscale.exe" -ArgumentList "/quiet" -Wait

    # ===============================
    # Start Tailscale
    # ===============================
    - name: Start Tailscale
      shell: powershell
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --accept-dns=false

        & "C:\Program Files\Tailscale\tailscale.exe" ip -4

    # ===============================
    # Verify RDP Port
    # ===============================
    - name: Verify RDP
      shell: powershell
      run: |
        netstat -an | findstr 3389

    # ===============================
    # Keep Alive
    # ===============================
    - name: Keep Connection Alive
      shell: powershell
      run: |
        while ($true) {
          Write-Host "RDP is running..."
          Start-Sleep -Seconds 300
        }
